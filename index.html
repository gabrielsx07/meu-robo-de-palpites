<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Palpites de Hoje</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        table { width: 90%; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { background: #00ff88; color: black; }
        tr:nth-child(even) { background: #252525; }
        .live { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚽ Jogos e Palpites do Dia</h1>
    <div id="tabela-container">Carregando jogos...</div>

    <script>
        // O script lê o arquivo palpites.csv que o robô gera
        Papa.parse("palpites.csv", {
            download: true,
            header: true,
            complete: function(results) {
                let data = results.data;
                let html = "<table><tr><th>Hora</th><th>Jogo</th><th>Liga</th><th>Status</th></tr>";
                
                data.forEach(row => {
                    if(row.Mandante) { // Verifica se a linha não está vazia
                        html += `<tr>
                            <td>${row.Horario || ''}</td>
                            <td>${row.Mandante} x ${row.Visitante}</td>
                            <td>${row.Liga}</td>
                            <td>${row.Status}</td>
                        </tr>`;
                    }
                });
                html += "</table>";
                document.getElementById("tabela-container").innerHTML = html;
            }
        });
    </script>
</body>
</html>
