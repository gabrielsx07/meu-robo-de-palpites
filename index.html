<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP'S OLIVEIRA - VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fundo Preto Profundo */
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        
        /* Card Estilo Dark com borda Vermelha */
        .card { 
            background: #111111; 
            border: 1px solid #330000; 
            border-top: 3px solid #ff0000;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.02); border-color: #ff0000; }

        /* Botão de Palpite Vermelho */
        .btn-palpite { 
            background: linear-gradient(90deg, #8b0000 0%, #ff0000 100%);
            color: white;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        .liga-badge { background: #222; color: #ff0000; font-size: 10px; font-weight: bold; border: 1px solid #444; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="text-center mb-12">
        <h1 class="text-4xl font-black italic text-white tracking-tighter">
            TIP'S <span class="text-red-600">OLIVEIRA</span>
        </h1>
        <p class="text-gray-500 text-sm mt-2">ESTATÍSTICAS AVANÇADAS EM TEMPO REAL</p>
    </header>

    <div id="container-jogos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
        <div class="col-span-full text-center text-gray-600">Carregando artilharia...</div>
    </div>

    <script>
        async function carregarPalpites() {
            try {
                const response = await fetch('palpites.csv?v=' + Date.now());
                const data = await response.text();
                const linhas = data.split('\n').filter(l => l.trim() !== "").slice(1);
                
                const container = document.getElementById('container-jogos');
                container.innerHTML = '';

                linhas.forEach(linha => {
                    const col = linha.split(',');
                    if (col.length < 7) return;

                    const [hora, liga, casa, logoCasa, fora, logoFora, palpite] = col;

                   container.innerHTML += `
                     <div class="card p-5">
                       <div class="flex justify-between mb-4">
                        <span class="liga-badge">${liga}</span>
                        <span class="text-xs font-bold text-slate-400">${hora}</span>
                    </div>
        
                    <div class="flex items-center justify-between mb-6 px-2">
                      <div class="text-center w-24">
                        <img src="${logoCasa}" class="w-14 h-14 mx-auto mb-2">
                        <p class="text-xs font-black uppercase">${casa}</p>
                      </div>
                      <div class="text-xl font-black text-red-500 italic">VS</div>
                      <div class="text-center w-24">
                        <img src="${logoFora}" class="w-14 h-14 mx-auto mb-2">
                        <p class="text-xs font-black uppercase">${fora}</p>
                      </div>
                    </div>

                    <div class="text-center mb-2">
                      <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Sugestão de Entrada</span>
                    </div>
                    <div class="btn-palpite">
                      ${palpite}
                    </div>
                  </div>
                 `;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('container-jogos').innerHTML = "Erro ao carregar dados.";
            }
        }

        carregarPalpites();
        // Atualiza a cada 5 minutos
        setInterval(carregarPalpites, 300000);
    </script>
</body>
</html>
