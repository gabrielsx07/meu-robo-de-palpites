<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP GORILLA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { 
            background: #1e293b; border-radius: 20px; padding: 20px; 
            border: 1px solid #334155; position: relative;
        }
        .league { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        .match { display: flex; align-items: center; justify-content: space-around; margin: 20px 0; }
        .team { text-align: center; width: 100px; }
        .team img { width: 45px; height: 45px; margin-bottom: 10px; }
        .team span { display: block; font-size: 13px; font-weight: 600; }
        .vs { color: #00ff88; font-weight: 900; }
        .badge-palpite { 
            background: linear-gradient(90deg, #059669, #10b981); 
            padding: 15px; border-radius: 12px; font-size: 14px;
            font-weight: bold; text-align: center; color: white;
        }
        .odd { background: #facc15; color: #000; padding: 2px 8px; border-radius: 5px; font-size: 12px; margin-top: 5px; display: inline-block; }
        .info-footer { display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; color: #64748b; }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#00ff88">⚽ VIP ANALYST</h1>
    <div id="grid" class="grid"></div>

    <script>
        Papa.parse("palpites.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                const games = results.data;
                let container = document.getElementById("grid");
                
                if (games.length === 0) {
                    container.innerHTML = "<h2 style='text-align:center'>Aguardando o robô processar jogos...</h2>";
                    return;
                }

                container.innerHTML = games.map(jogo => `
                    <div class="card">
                        <div class="league">${jogo.Liga} • ${jogo.Hora}</div>
                        <div class="match">
                            <div class="team"><img src="${jogo.LogoCasa}"><span>${jogo.TimeCasa}</span></div>
                            <div class="vs">VS</div>
                            <div class="team"><img src="${jogo.LogoFora}"><span>${jogo.TimeFora}</span></div>
                        </div>
                        <div class="badge-palpite">
                            ${jogo.Palpite} <br>
                            <span class="odd">ODD: ${jogo.Odd}</span>
                        </div>
                        <div class="info-footer">
                            <span>Status: ${jogo.Status}</span>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
