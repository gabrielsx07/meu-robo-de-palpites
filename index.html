<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORILLA VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .grid-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 15px;
        }
        .btn-palpite { 
            background-color: #ef4444; 
            color: white; 
            font-weight: bold; 
            text-align: center; 
            padding: 10px; 
            border-radius: 8px;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .liga-tag { font-size: 10px; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>
    <header class="p-6 text-center">
        <h1 class="text-2xl font-black text-red-500">GORILLA <span class="text-white">VIP</span></h1>
    </header>

    <div id="container-jogos" class="grid-jogos">
        </div>

    <script>
        async function carregar() {
            const res = await fetch('palpites.csv?v=' + Date.now());
            const csv = await res.text();
            const linhas = csv.split('\n').slice(1);
            const container = document.getElementById('container-jogos');
            container.innerHTML = '';

            linhas.forEach(l => {
                const c = l.split(',');
                if (c.length < 7) return;
                container.innerHTML += `
                    <div class="card">
                        <div class="flex justify-between mb-3">
                            <span class="liga-tag">${c[1]}</span>
                            <span class="text-xs text-slate-400">${c[0]}</span>
                        </div>
                        <div class="flex justify-around items-center">
                            <div class="text-center"><img src="${c[3]}" class="w-10 h-10 mx-auto"><p class="text-[10px] mt-1">${c[2]}</p></div>
                            <div class="text-red-500 font-bold">VS</div>
                            <div class="text-center"><img src="${c[5]}" class="w-10 h-10 mx-auto"><p class="text-[10px] mt-1">${c[4]}</p></div>
                        </div>
                        <div class="btn-palpite">${c[6]}</div>
                    </div>
                `;
            });
        }
        carregar();
    </script>
</body>
</html>
