<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP'S OLIVEIRA - VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ESTILO DO FUNDO E TEXTO */
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            padding: 20px;
        }

        /* GRID QUE DEIXA OS CARDS LADO A LADO */
        .grid-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* O CARD BONITINHO QUE VOCÊ GOSTOU */
        .card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 18px;
            position: relative;
        }

        /* TAG DA LIGA NO TOPO */
        .liga-tag { 
            background: #334155;
            font-size: 10px; 
            color: #94a3b8; 
            font-weight: bold; 
            padding: 3px 10px;
            border-radius: 5px;
        }

        /* O BOTÃO VERMELHO DE SUGESTÃO */
        .btn-palpite { 
            background-color: #ef4444; 
            color: white; 
            font-weight: 900; 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px;
            margin-top: 15px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .vs-text {
            color: #ef4444;
            font-weight: 900;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header class="mb-10 text-center">
        <h1 class="text-3xl font-black text-white italic uppercase">
            TIP'S <span class="text-red-600">OLIVEIRA</span>
        </h1>
        <p class="text-slate-500 text-[10px] font-bold tracking-widest mt-1">ESTATÍSTICAS AVANÇADAS EM TEMPO REAL</p>
    </header>

    <div id="container-jogos" class="grid-jogos">
        </div>

    <script>
        async function carregarPalpites() {
            try {
                const response = await fetch('palpites.csv?v=' + Date.now());
                const data = await response.text();
                const linhas = data.split('\n').filter(row => row.trim() !== "").slice(1);
                
                const container = document.getElementById('container-jogos');
                container.innerHTML = '';

                linhas.forEach(linha => {
                    const c = linha.split(',');
                    if (c.length < 7) return;

                    const [hora, liga, casa, logoCasa, fora, logoFora, palpite] = c;

                    container.innerHTML += `
                        <div class="card">
                            <div class="flex justify-between items-start mb-4">
                                <span class="liga-tag">${liga}</span>
                                <span class="text-[11px] text-slate-400 font-bold">${hora}</span>
                            </div>
                            
                            <div class="flex justify-around items-center mb-2">
                                <div class="text-center w-1/3">
                                    <img src="${logoCasa}" class="w-12 h-12 mx-auto mb-2 object-contain">
                                    <p class="text-[10px] font-bold uppercase leading-tight">${casa}</p>
                                </div>

                                <div class="vs-text">VS</div>

                                <div class="text-center w-1/3">
                                    <img src="${logoFora}" class="w-12 h-12 mx-auto mb-2 object-contain">
                                    <p class="text-[10px] font-bold uppercase leading-tight">${fora}</p>
                                </div>
                            </div>

                            <div class="mt-4">
                                <p class="text-[9px] text-center text-slate-500 font-bold uppercase mb-1">Sugestão</p>
                                <div class="btn-palpite">
                                    ${palpite}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Erro ao carregar:", e);
            }
        }
        carregarPalpites();
    </script>
</body>
</html>
