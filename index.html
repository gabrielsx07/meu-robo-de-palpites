<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP'S OLIVEIRA - Pro Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; }
        .card { background: #1e293b; border-left: 4px solid #10b981; }
        .badge { background: #334155; padding: 2px 8px; border-radius: 4px; font-size: 10px; }
    </style>
</head>
<body class="p-4">
    <h1 class="text-2xl font-black text-center my-6 text-emerald-500 italic">TIP'S OLIVEIRA</h1>
    
    <div id="container-jogos" class="grid gap-4 max-w-2xl mx-auto">
        <p class="text-center text-slate-500">Buscando estatísticas avançadas...</p>
    </div>

    <script>
        async function load() {
            const res = await fetch('palpites.csv?v=' + Date.now());
            const text = await res.text();
            const rows = text.split('\n').slice(1);
            const container = document.getElementById('container-jogos');
            container.innerHTML = '';

            rows.forEach(row => {
                const col = row.split(',');
                if(col.length < 7) return;
                const [hora, liga, casa, logoC, fora, logoF, palpite] = col;

                container.innerHTML += `
                <div class="card p-4 rounded-lg flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <span class="badge">${liga}</span>
                        <span class="text-xs font-bold text-emerald-400">${hora}</span>
                    </div>
                    <div class="flex items-center justify-around">
                        <div class="text-center">
                            <img src="${logoC}" class="w-10 h-10 mx-auto">
                            <p class="text-xs mt-1 font-bold">${casa}</p>
                        </div>
                        <div class="text-slate-500 text-xs">VS</div>
                        <div class="text-center">
                            <img src="${logoF}" class="w-10 h-10 mx-auto">
                            <p class="text-xs mt-1 font-bold">${fora}</p>
                        </div>
                    </div>
                    <div class="mt-2 bg-emerald-500/10 border border-emerald-500/20 p-2 rounded text-center">
                        <span class="text-xs text-emerald-300 uppercase block font-black">Sugestão de Entrada</span>
                        <span class="text-sm font-bold">${palpite}</span>
                    </div>
                </div>`;
            });
        }
        load();
    </script>
</body>
</html>
