<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Analista - Palpites</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --success: #10b981; --text: #f1f5f9; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: left; width: 100%; max-width: 1200px; margin-bottom: 30px; }
        .header .main-val { font-size: 48px; font-weight: 900; color: var(--success); margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .match-card { background: var(--card); border-radius: 24px; padding: 24px; border: 1px solid #334155; }
        .teams-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team { text-align: center; flex: 1; font-weight: 700; }
        .team-logo { width: 50px; height: 50px; background: #334155; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--accent); font-size: 20px; }
        .analysis-box { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .prediction { font-size: 18px; font-weight: 900; }
        .odds-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; color: #94a3b8; }
        .odds-row b { color: var(--accent); }
        .bar-bg { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .bar-fill { height: 100%; background: var(--success); box-shadow: 0 0 10px var(--success); }
    </style>
</head>
<body>
    <div class="header">
        <p class="main-val">LIVE ODDS</p>
    </div>
    <div class="grid" id="matchGrid"></div>

    <script>
        function loadPalpites() {
            Papa.parse('palpites.csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const grid = document.getElementById('matchGrid');
                    grid.innerHTML = '';
                    results.data.forEach(row => {
                        if (!row.TimeCasa) return;
                        grid.innerHTML += `
                            <div class="match-card">
                                <div class="teams-display">
                                    <div class="team"><div class="team-logo">${row.TimeCasa[0]}</div><div>${row.TimeCasa}</div></div>
                                    <div style="color:#64748b; font-weight:800">VS</div>
                                    <div class="team"><div class="team-logo">${row.TimeFora[0]}</div><div>${row.TimeFora}</div></div>
                                </div>
                                <div class="odds-row">
                                    <span>Odd Casa: <b>${row.OddCasa}</b></span>
                                    <span>xG: <b>${row.xG}</b></span>
                                    <span>Odd Fora: <b>${row.OddFora}</b></span>
                                </div>
                                <div class="analysis-box">
                                    <div style="font-size:10px; color:var(--accent); font-weight:800">PALPITE IA</div>
                                    <div class="prediction">${row.Entrada}</div>
                                </div>
                                <div style="display:flex; justify-content:flex-end; font-size:12px; color:var(--success); font-weight:800">${row.Assertividade}% Confiança</div>
                                <div class="bar-bg"><div class="bar-fill" style="width:${row.Assertividade}%"></div></div>
                            </div>`;
                    });
                }
            });
        }
        loadPalpites();
        setInterval(loadPalpites, 60000); // Atualiza a cada 1 minuto
    </script>
</body>
</html>
