<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP'S OLIVEIRA - Palpites Reais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; }
        .btn-odd { background-color: #10b981; color: #064e3b; font-weight: bold; }
    </style>
</head>
<body class="p-4">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold flex justify-center items-center gap-2">
            ⚽ TIP'S OLIVEIRA
        </h1>
    </div>

    <div id="container-jogos" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-6xl mx-auto">
        <p class="text-center col-span-full">Carregando palpites reais da Bet365...</p>
    </div>

    <script>
        async function carregarPalpites() {
            try {
                // O '?v=' + Date.now() serve para limpar o cache e atualizar na hora!
                const response = await fetch('palpites.csv?v=' + Date.now());
                const data = await response.text();
                const linhas = data.split('\n').slice(1); // Pula o cabeçalho
                
                const container = document.getElementById('container-jogos');
                container.innerHTML = '';

                linhas.forEach(linha => {
                    const col = linha.split(',');
                    if (col.length < 7) return;

                    // Estrutura do CSV: Hora, Liga, TimeCasa, LogoCasa, TimeFora, LogoFora, Palpite, Odd
                    const [hora, liga, casa, logoCasa, fora, logoFora, palpite, odd] = col;

                    const card = `
                        <div class="card p-6 rounded-2xl shadow-xl relative">
                            <div class="text-xs text-slate-400 mb-4 uppercase tracking-widest">${liga} • ${hora}</div>
                            
                            <div class="flex justify-between items-center mb-6">
                                <div class="text-center w-1/3">
                                    <img src="${logoCasa}" class="w-12 h-12 mx-auto mb-2">
                                    <div class="text-sm font-bold">${casa}</div>
                                </div>
                                <div class="text-emerald-500 font-black text-xl italic">VS</div>
                                <div class="text-center w-1/3">
                                    <img src="${logoFora}" class="w-12 h-12 mx-auto mb-2">
                                    <div class="text-sm font-bold">${fora}</div>
                                </div>
                            </div>

                            <div class="btn-odd w-full py-3 rounded-xl text-center">
                                <div class="text-xs uppercase">${palpite}</div>
                                <div class="text-lg">ODD: ${odd}</div>
                            </div>
                            <div class="text-[10px] text-slate-500 mt-2">Status: Confirmado via API</div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                document.getElementById('container-jogos').innerHTML = "<p class='text-center text-red-500'>Erro ao carregar os palpites. Verifique se o arquivo CSV existe.</p>";
            }
        }

        carregarPalpites();
    </script>
</body>
</html>
