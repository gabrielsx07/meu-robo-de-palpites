<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Palpites - Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --success: #10b981; --text: #f1f5f9; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 40px; font-weight: 900; color: var(--success); margin-bottom: 30px; letter-spacing: -1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1100px; }
        .match-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #334155; position: relative; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team { text-align: center; flex: 1; font-weight: 700; font-size: 14px; }
        .team-logo { width: 45px; height: 45px; background: #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; color: var(--accent); font-weight: 900; }
        .odds-bar { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; background: rgba(15, 23, 42, 0.5); padding: 8px 12px; border-radius: 10px; margin-bottom: 15px; }
        .odds-bar b { color: var(--accent); }
        .prediction-box { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 12px; text-align: center; font-weight: 900; color: #fff; }
        .conf-label { display: flex; justify-content: space-between; font-size: 11px; margin-top: 15px; color: var(--success); font-weight: 800; text-transform: uppercase; }
        .bar-bg { height: 6px; background: #0f172a; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--success); box-shadow: 0 0 10px var(--success); }
    </style>
</head>
<body>
    <div class="main-title">LIVE ANALYSIS</div>
    <div class="grid" id="matchGrid"></div>

    <script>
        function loadData() {
            // Puxa o CSV da mesma pasta onde está o HTML
            Papa.parse('palpites.csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const grid = document.getElementById('matchGrid');
                    grid.innerHTML = '';
                    results.data.forEach(row => {
                        if(!row.TimeCasa) return;
                        grid.innerHTML += `
                        <div class="match-card">
                            <div class="teams">
                                <div class="team"><div class="team-logo">${row.TimeCasa[0]}</div>${row.TimeCasa}</div>
                                <div style="color:#475569; font-weight:900; font-size:12px;">VS</div>
                                <div class="team"><div class="team-logo">${row.TimeFora[0]}</div>${row.TimeFora}</div>
                            </div>
                            <div class="odds-bar">
                                <span>ODD: <b>${row.OddCasa}</b></span>
                                <span>xG: <b>${row.xG}</b></span>
                                <span>ODD: <b>${row.OddFora}</b></span>
                            </div>
                            <div class="prediction-box">🎯 ${row.Entrada}</div>
                            <div class="conf-label"><span>Confiança IA</span><span>${row.Assertividade}%</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width: ${row.Assertividade}%"></div></div>
                        </div>`;
                    });
                }
            });
        }
        loadData();
        setInterval(loadData, 30000); // Atualiza a cada 30 segundos
    </script>
</body>
</html>
