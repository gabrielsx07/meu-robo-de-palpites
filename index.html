<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostador PRO - Dark Mode v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19; /* Fundo ainda mais escuro */
            --card-bg: #111827; /* Fundo do card */
            --primary: #10b981; /* Verde esmeralda para os acertos */
            --text: #f9fafb;
            --dim: #9ca3af;
            --border: #374151;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 25px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Nova Barra Superior e Título */
        .header-bar {
            background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }
        .header-title { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Grid */
        .grid-jogos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px;
        }

        /* Card do Jogo Atualizado */
        .match-card {
            background: var(--card-bg); border-radius: 28px; padding: 22px;
            border: 1px solid var(--border); transition: all 0.2s ease;
        }
        .match-card:hover { transform: translateY(-7px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1); }

        .time-header { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 18px; display: block; text-transform: uppercase; }

        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .team { width: 45%; text-align: center; }
        
        /* Nova Lógica para Imagem Real */
        .team-logo-img { 
            width: 60px; height: 60px; margin: 0 auto 10px; display: block; object-fit: contain;
        }
        .team-name { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; }

        /* Box de Informação da Entrada */
        .prediction-box {
            background: #0b0f19; border-radius: 20px; padding: 20px; margin-bottom: 18px; border: 1px solid var(--border);
        }
        .label-entrada { font-size: 9px; color: var(--dim); font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .val-entrada { font-size: 16px; font-weight: 800; color: #fff; }

        /* Nova Barra de Assertividade (Progresso) */
        .assertividade-container { margin-top: 10px; }
        .bar-label-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
        .bar-base { height: 8px; background: #374151; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 10px; }

    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title">ROBÔ DE PALPITES PRO v2.0</div>
        <div style="font-size: 12px; font-weight: 600; color: var(--dim);">Assertividade Global (30D): <span style="color:var(--primary); font-weight:800;">76.4%</span></div>
    </div>

    <div class="grid-jogos" id="lista-jogos"></div>
</div>

<script>
    Papa.parse("palpites.csv", {
        download: true, header: true, skipEmptyLines: true,
        complete: function(results) {
            let html = "";
            results.data.forEach(row => {
                if (!row.TimeCasa) return;
                
                // Pega a porcentagem (ex: "92") para desenhar a barra
                const porc = parseInt(row.Assertividade) || 85; 

                // URL para buscar os escudos reais usando o ID que salvamos no Python
                const logoCasa = `https://crests.football-data.org/${row.IdCasa}.png`;
                const logoFora = `https://crests.football-data.org/${row.IdFora}.png`;

                html += `
                    <div class="match-card">
                        <span class="time-header">● HOJE • ${row.Hora}</span>
                        <div class="teams">
                            <div class="team">
                                <img src="${logoCasa}" class="team-logo-img" alt="Logo ${row.TimeCasa}" onerror="this.src='https://placehold.co/60x60/333/666?text=${row.TimeCasa[0]}'">
                                <div class="team-name">${row.TimeCasa}</div>
                            </div>
                            <div style="font-weight: 900; color: var(--border);">VS</div>
                            <div class="team">
                                <img src="${logoFora}" class="team-logo-img" alt="Logo ${row.TimeFora}" onerror="this.src='https://placehold.co/60x60/333/666?text=${row.TimeFora[0]}'">
                                <div class="team-name">${row.TimeFora}</div>
                            </div>
                        </div>
                        <div class="prediction-box">
                            <span class="label-entrada">Entrada Recomendada</span>
                            <div class="val-entrada">${row.Entrada}</div>
                        </div>
                        
                        <div class="assertividade-container">
                            <div class="bar-label-row">
                                <span>ASSERTIVIDADE (HISTÓRICO)</span>
                                <span style="color:var(--primary); font-weight:800;">${porc}%</span>
                            </div>
                            <div class="bar-base">
                                <div class="bar-fill" style="width: ${porc}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById("lista-jogos").innerHTML = html;
        }
    });
</script>

</body>
</html>
