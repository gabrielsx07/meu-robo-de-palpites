<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP'S OLIVEIRA - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #1e293b; border-left: 4px solid #10b981; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .badge { background: #334155; padding: 2px 8px; border-radius: 4px; font-size: 10px; color: #cbd5e1; }
    </style>
</head>
<body class="p-4 bg-slate-950">
    <header class="text-center py-8">
        <h1 class="text-2xl font-black text-emerald-500 italic tracking-tighter">TIP'S OLIVEIRA PRO 🦍</h1>
        <p class="text-[10px] text-slate-500 uppercase tracking-widest">Análise de Dados Avançada</p>
    </header>
    
    <div id="lista-palpites" class="grid gap-4 max-w-xl mx-auto">
        <div class="text-center py-10 text-slate-600">Processando estatísticas do dia...</div>
    </div>

    <script>
        async function fetchTips() {
            try {
                const r = await fetch('palpites.csv?v=' + Date.now());
                const data = await r.text();
                const rows = data.split('\n').filter(row => row.trim() !== "").slice(1);
                const container = document.getElementById('lista-palpites');
                container.innerHTML = '';

                rows.forEach(row => {
                    const col = row.split(',');
                    if(col.length < 7) return;
                  // No seu script dentro do index.html, altere a parte do loop:
const [hora, liga, casa, logoC, fora, logoF, palpite, detalhe, confianca] = col;

container.innerHTML += `
<div class="card p-5 rounded-3xl shadow-2xl bg-slate-900 border border-slate-800 mb-4">
    <div class="flex justify-between items-center mb-4">
        <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full font-bold uppercase tracking-tighter">${liga}</span>
        <span class="text-[10px] text-slate-500">${hora}</span>
    </div>

    <div class="flex items-center justify-between mb-6">
        <div class="text-center w-1/3">
            <img src="${logoC}" class="w-12 h-12 mx-auto drop-shadow-lg">
            <p class="text-xs font-bold mt-2 truncate">${casa}</p>
        </div>
        <div class="text-center">
            <span class="text-xs font-black text-slate-700 italic">VS</span>
        </div>
        <div class="text-center w-1/3">
            <img src="${logoF}" class="w-12 h-12 mx-auto drop-shadow-lg">
            <p class="text-xs font-bold mt-2 truncate">${fora}</p>
        </div>
    </div>

    <div class="bg-black/30 rounded-2xl p-3 mb-3 border border-white/5">
        <p class="text-[11px] text-slate-400 italic mb-1">Análise do Especialista:</p>
        <p class="text-xs text-white font-medium">${detalhe}</p>
    </div>

    <div class="flex gap-2">
        <div class="w-3/4 bg-emerald-600 p-3 rounded-xl text-center">
            <span class="text-[10px] block uppercase opacity-75 font-bold">Sugestão</span>
            <span class="text-sm font-black">${palpite}</span>
        </div>
        <div class="w-1/4 bg-slate-800 p-3 rounded-xl text-center flex flex-col justify-center">
            <span class="text-[9px] block uppercase opacity-50">Confiança</span>
            <span class="text-sm font-black text-emerald-400">${confianca}</span>
        </div>
    </div>
</div>
`;
                });
            } catch (e) {
                console.error(e);
            }
        }
        fetchTips();
    </script>
</body>
</html>
