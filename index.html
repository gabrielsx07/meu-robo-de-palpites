<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostador PRO - IA Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #ffffff;
            --primary: #34c759; /* Verde Apple */
            --text-dark: #1c1c1e;
            --text-light: #8e8e93;
            --border: #f2f2f7;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-dark); 
            margin: 0; padding: 0;
            line-height: 1.4;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .container { max-width: 480px; margin: 0 auto; padding: 20px; }

        /* Card de Performance do Topo */
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .stats-label { font-size: 11px; font-weight: 800; color: var(--text-light); letter-spacing: 0.5px; }
        .win-rate { font-size: 32px; font-weight: 800; color: var(--primary); margin: 5px 0; }
        .bar-container { height: 8px; background: #f2f2f7; border-radius: 10px; margin-top: 15px; overflow: hidden; display: flex; }
        .bar-green { background: var(--primary); width: 76%; }
        .bar-red { background: #ff3b30; width: 24%; }

        /* Filtros */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { 
            padding: 10px 20px; border-radius: 12px; border: none; 
            background: #f2f2f7; font-weight: 700; font-size: 13px; color: var(--text-dark);
        }
        .tab.active { background: #000; color: #fff; }

        /* Card de Jogo (O "Hit" Único) */
        .match-card {
            background: #fff;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }
        .match-card:active { transform: scale(0.98); }

        .match-info { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 15px; }
        .badge-live { color: var(--primary); display: flex; align-items: center; gap: 4px; }

        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .team { display: flex; align-items: center; gap: 12px; width: 42%; }
        .team img { width: 35px; height: 35px; border-radius: 50%; background: #f2f2f7; }
        .team span { font-weight: 800; font-size: 14px; }

        /* Área da Entrada Analisada (xG, Cantos, etc) */
        .prediction-box {
            background: #f8f9fa;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prediction-text span { display: block; font-size: 10px; color: var(--text-light); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .prediction-text strong { font-size: 15px; font-weight: 800; color: #000; }
