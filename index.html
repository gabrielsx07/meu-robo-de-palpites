<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORILLA VIP - Palpites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* CONFIGURAÇÃO GERAL DO FUNDO */
        body { 
            background-color: #020617; /* Azul quase preto */
            color: #f8fafc; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px 10px;
        }

        /* CONTAINER DOS CARDS - UM EMBAIXO DO OUTRO */
        #container-jogos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 550px; /* Largura ideal para celular e PC */
            margin: 0 auto;
        }

        /* ESTILO DO CARD */
        .card { 
            background-color: #1e293b; /* Cinza azulado escuro */
            border: 1px solid #334155; 
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        /* DISTINTIVO DA LIGA */
        .liga-badge {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* BOTÃO DE PALPITE VERMELHO (ESTILO OLIVEIRA) */
        .btn-palpite { 
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            color: white; 
            font-weight: 900;
            text-transform: uppercase;
            padding: 16px;
            text-align: center;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vs-text {
            color: #ef4444;
            font-style: italic;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .loading-text {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header class="text-center mb-10">
        <h1 class="text-3xl font-black italic text-red-500 uppercase tracking-tighter">
            Gorilla <span class="text-white">VIP</span>
        </h1>
        <p class="text-slate-500 text-xs font-bold mt-1">PALPITES ATUALIZADOS EM TEMPO REAL</p>
    </header>

    <div id="container-jogos">
        <div class="loading-text font-bold">CARREGANDO PALPITES...</div>
    </div>

    <script>
        async function carregarPalpites() {
            try {
                // O ?v= força o navegador a pegar o arquivo novo do GitHub
                const response = await fetch('palpites.csv?v=' + Date.now());
                const data = await response.text();
                
                const linhas = data.split('\n').filter(row => row.trim() !== "").slice(1); 
                const container = document.getElementById('container-jogos');
                
                if (linhas.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-500">Nenhum jogo disponível agora.</div>';
                    return;
                }

                container.innerHTML = ''; // Limpa o carregando

                linhas.forEach(linha => {
                    const col = linha.split(',');
                    if (col.length < 7) return;

                    const [hora, liga, casa, logoCasa, fora, logoFora, palpite] = col;

                    const cardHtml = `
                        <div class="card">
                            <div class="flex justify-between items-center mb-5">
                                <span class="liga-badge">${liga}</span>
                                <span class="text-xs font-black text-slate-400">${hora}</span>
                            </div>
                            
                            <div class="flex items-center justify-between px-2 mb-2">
                                <div class="text-center w-1/3">
                                    <img src="${logoCasa}" class="w-14 h-14 mx-auto mb-2 object-contain" onerror="this.src='https://via.placeholder.com/60'">
                                    <p class="text-[11px] font-black uppercase leading-tight">${casa}</p>
                                </div>

                                <div class="vs-text">VS</div>

                                <div class="text-center w-1/3">
                                    <img src="${logoFora}" class="w-14 h-14 mx-auto mb-2 object-contain" onerror="this.src='https://via.placeholder.com/60'">
                                    <p class="text-[11px] font-black uppercase leading-tight">${fora}</p>
                                </div>
                            </div>

                            <div class="mt-4">
                                <p class="text-[10px] text-center text-slate-500 font-bold uppercase mb-1 tracking-widest">Entrada Sugerida</p>
                                <div class="btn-palpite">
                                    ${palpite}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });
            } catch (error) {
                console.error("Erro ao carregar CSV:", error);
            }
        }

        // Inicia a busca
        carregarPalpites();
    </script>
</body>
</html>
