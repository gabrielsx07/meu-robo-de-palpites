name: Automacao Total Palpites

on:
  schedule:
    - cron: '0 3 * * *' # Roda meia-noite
  workflow_dispatch: # Botão para rodar agora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Instalando Pandas
        run: pip install pandas
      - name: Executando Robô
        run: python bot.py
      - name: Atualizando Site
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add palpites.csv
          git commit -m "Site atualizado: $(date)" || exit 0
          git push
