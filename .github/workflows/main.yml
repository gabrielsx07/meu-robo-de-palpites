name: Robo de Palpites Autonomo

on:
  schedule:
    - cron: '0 * * * *' # Roda sozinho de 1 em 1 hora
  workflow_dispatch:     # Deixa o botão de "rodar manual" disponível

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Isso dá permissão para o robô salvar o arquivo na sua pasta
    
    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Bibliotecas
        run: pip install pandas requests pytz

      - name: Executar o Robo
        run: python bot.py

      - name: Salvar resultados no GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add palpites.csv
          git commit -m "Atualização Automática dos Jogos" || exit 0
          git push
