name: Automacao Total Palpites

on:
  schedule:
    - cron: '0 3 * * *' # Roda todo dia às 00:00 (Horário de Brasília)
  workflow_dispatch: # Permite que você rode na mão quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Python e Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
          pip install pandas selenium webdriver-manager pytesseract Pillow

      - name: Rodar o Robo Analista
        run: python bot.py # Verifique se o nome do seu arquivo é esse mesmo

      - name: Salvar resultados no GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add palpites.csv
          git commit -m "Planilha atualizada por IA" || exit 0
          git push
