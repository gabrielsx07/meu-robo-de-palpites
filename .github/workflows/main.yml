name: Automacao de Palpites Profissional

on:
  schedule:
    - cron: '0 * * * *'  # Roda sozinho de 1 em 1 hora
  workflow_dispatch:      # Permite rodar manualmente clicando no botão

jobs:
  executar-robo:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Permite que o robô escreva o arquivo no seu GitHub
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: |
           python -m pip install --upgrade pip
           pip install pandas requests pytz thefuzz python-Levenshtein
      
      - name: Rodar script de palpites
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_KEY: ${{ secrets.THE_ODDS_KEY }}
        run: python bot.py
        
      - name: Salvar Dados no Repositorio
        run: |
          git config --global user.name "Robo Autonomo"
          git config --global user.email "bot@github.com"
          git add palpites.csv
          git commit -m "Atualizacao Automatica: $(date)" || exit 0
          git push
