name: Robo de Palpites Autonomo

on:
  schedule:
    - cron: '0 * * * *' # Roda sozinho toda hora
  workflow_dispatch:     # Permite rodar manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANTE: Permissão para o robô salvar o arquivo
    
    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Bibliotecas
        run: pip install pandas requests pytz

      - name: Executar o Robo
        run: python bot.py

      - name: Salvar resultados no GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add palpites.csv
          git commit -m "Atualização Automática: $(date)" || exit 0
          git push
