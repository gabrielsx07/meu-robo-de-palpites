name: Atualizar Palpites
on:
  schedule:
    - cron: '0 */4 * * *' # Roda a cada 4 horas
  workflow_dispatch:

permissions:
  contents: write  # ISSO AQUI É OBRIGATÓRIO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar dependências
        run: pip install pandas requests pytz thefuzz python-Levenshtein
        
      - name: Rodar Script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_KEY: ${{ secrets.THE_ODDS_KEY }}
        run: python bot.py
        
      - name: Commitar mudanças
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add palpites.csv
          git commit -m "Atualizacao Automatica: $ (date)" || echo "Sem mudanças"
          git push origin main
