name: Automacao Total Palpites

on:
  schedule:
    - cron: '0 3 * * *' # Roda às 00:00 do Brasil
  workflow_dispatch: # Botão para rodar na hora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Pandas
        run: pip install pandas

      - name: Instalar Dependências
        run: |
         python -m pip install --upgrade pip
         pip install pandas requests

      - name: Executar o Robo
        run: python bot.py

      - name: Commit e Push dos resultados
        run: |
         git config --global user.name "Bot de Palpites"
         git config --global user.email "bot@github.com"
         git add palpites.csv
         git commit -m "Atualizando palpites: $(date)" || echo "Sem mudanças"
         git push
