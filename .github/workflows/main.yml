name: Atualizar Palpites VIP
on:
  schedule:
    - cron: '0 */2 * * *' # Roda a cada 4 horas
  workflow_dispatch: # Permite rodar na mão quando quiser

permissions:
  contents: write # ESSENCIAL: Dá permissão para o robô salvar o CSV

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar dependências
        run: pip install pandas requests beautifulsoup4
        
      - name: Executar Robô
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python bot.py
        
      - name: Salvar resultados no GitHub
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add palpites.csv
          git commit -m "Odds atualizadas automaticamente" || exit 0
          git push
