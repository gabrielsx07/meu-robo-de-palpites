name: Atualizar Palpites IA

on:
  schedule:
    # Roda a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite que você rode manualmente no botão

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Dá permissão para o robô salvar o arquivo no seu GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Rodar o Robô Analista
        run: python bot.py

      - name: Salvar mudanças no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add palpites.csv
          # O commit só acontece se houver mudanças, evitando erros
          git commit -m "Atualizando palpites via IA Gorilla" || echo "Sem mudanças para salvar"
          git push origin main
