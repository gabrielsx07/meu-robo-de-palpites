name: Autonomia Total

on:
  schedule:
    - cron: '0 * * * *' # Roda sozinho de 1 em 1 hora
  workflow_dispatch:     # Deixa o botão de rodar manual se você quiser

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Dá permissão para o robô salvar arquivos
    
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Bibliotecas
        run: pip install pandas requests pytz

      - name: Rodar o Bot
        run: python bot.py

      - name: Salvar Resultados (Autonomia)
        run: |
          git config --global user.name "Robo Autonomo"
          git config --global user.email "bot@github.com"
          git add palpites.csv
          git commit -m "Palpites Atualizados: $(date)" || exit 0
          git push
