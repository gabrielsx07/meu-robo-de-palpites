name: Atualizar Palpites Diários

on:
  schedule:
    - cron: '0 09 * * *' # Roda todo dia às 06:00 da manhã (horário de Brasília)
  workflow_dispatch: # Permite que você clique em um botão para atualizar na hora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v2

      - name: Configurar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Instalar bibliotecas
        run: pip install requests pandas

      - name: Rodar o Robô
        run: python bot.py

      - name: Salvar mudanças no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add palpites.csv
          git commit -m "Atualizando palpites automaticamente" || exit 0
          git push
