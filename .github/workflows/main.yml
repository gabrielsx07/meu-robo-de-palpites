name: Atualizar Palpites Gorilla

on:
  schedule:
    # Roda de 3 em 3 horas automaticamente
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite que você rode manualmente clicando no botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas cloudscraper beautifulsoup4

      - name: Executar Robô de Palpites
        run: python bot.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add palpites.csv
          git commit -m "Palpites atualizados via Robô" || exit 0
          git push
